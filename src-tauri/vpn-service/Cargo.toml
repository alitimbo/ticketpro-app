[package]
name = "ticketpro-vpn-service"
version = "0.1.0"
description = "Service Windows privilegie pour le VPN embarque TicketPro"
authors = ["Akicorp Solutions"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
base64 = "0.22"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_Services"
] }
