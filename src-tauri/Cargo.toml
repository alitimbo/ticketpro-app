[package]
name = "ticketpro"
version = "0.1.0"
description = "Gestion locale et distante de hotspots MikroTik"
authors = ["Akicorp Solutions"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ticketpro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
