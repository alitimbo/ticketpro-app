services:
  wireguard-hub:
    build: .
    container_name: ticketpro-wireguard-hub
    init: true
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./wireguard:/etc/wireguard
      - ./data:/data
    environment:
      HUB_BIND: 127.0.0.1
      HUB_PORT: ${HUB_PORT:-8788}
      WG_INTERFACE: wg0
      HUB_MASTER_TOKEN: ${HUB_MASTER_TOKEN}
      HUB_TENANTS_FILE: /data/tenants.json
      HUB_ALLOWED_ORIGIN: ${HUB_ALLOWED_ORIGIN:-null}
      HUB_PUBLIC_ENDPOINT: ${HUB_PUBLIC_ENDPOINT}
      HUB_SERVER_PUBLIC_KEY: ${HUB_SERVER_PUBLIC_KEY}
      HUB_SERVER_PORT: ${HUB_SERVER_PORT:-51820}
      HUB_SUPERNET: ${HUB_SUPERNET:-10.250.0.0/16}
      HUB_TENANT_PREFIX: ${HUB_TENANT_PREFIX:-24}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run:size=16m,mode=0755
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.HUB_PORT||'8788')+'/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
