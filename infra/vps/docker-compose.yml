services:
  reverse-proxy:
    image: caddy:2.10.0-alpine
    container_name: ticketpro-reverse-proxy
    init: true
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TICKETPRO_RELEASES_DIR:-/opt/ticketpro/releases}:/srv/releases:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:2019/config/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  caddy-data:
  caddy-config:
